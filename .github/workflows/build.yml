name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key from secret
        env:
          BG_KEYSTORE_BASE64: ${{ secrets.BG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BG_KEYSTORE_BASE64" ]; then
            echo "$BG_KEYSTORE_BASE64" | base64 -d > app/bgplayer.keystore
            echo "signing key: from secret BG_KEYSTORE_BASE64"
          else
            echo "::warning::Secret BG_KEYSTORE_BASE64 is not set: APK is signed with a temporary key and will NOT install over a previous version"
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out rel
          cp app/build/outputs/apk/debug/app-debug.apk "out/BGplayer-1.0.${GITHUB_RUN_NUMBER}.apk"
          # Constant name in releases: .../releases/latest/download/BGplayer.apk always points to the newest build
          cp app/build/outputs/apk/debug/app-debug.apk rel/BGplayer.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BGplayer 1.0.${{ github.run_number }}
          body: |
            Сборка из коммита ${{ github.sha }}.
            ${{ github.event.head_commit.message }}
          files: rel/BGplayer.apk
          make_latest: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: BGplayer-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
